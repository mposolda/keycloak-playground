<svg width="100%" viewBox="0 0 760 130" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .box-title { font-size: 12px; font-weight: 700; }
    .box-sub { font-size: 11px; }
  </style>

  <!-- Issuer JWT -->
  <rect x="10" y="20" width="200" height="90" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="110" y="44" text-anchor="middle" class="box-title" fill="#065f46">Issuer-signed JWT</text>
  <text x="110" y="62" text-anchor="middle" class="box-sub" fill="#065f46">iss, sub, vct, iat, exp</text>
  <text x="110" y="78" text-anchor="middle" class="box-sub" fill="#065f46">_sd (digests), cnf (key)</text>
  <text x="110" y="94" text-anchor="middle" class="box-sub" fill="#065f46">signed by Issuer</text>

  <!-- ~ separator 1 -->
  <text x="216" y="68" font-size="18" fill="#57606a">~</text>

  <!-- Disclosures -->
  <rect x="228" y="20" width="180" height="90" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="318" y="44" text-anchor="middle" class="box-title" fill="#92400e">Disclosures</text>
  <text x="318" y="62" text-anchor="middle" class="box-sub" fill="#92400e">[salt, name, value]</text>
  <text x="318" y="78" text-anchor="middle" class="box-sub" fill="#92400e">one per selected claim</text>
  <text x="318" y="94" text-anchor="middle" class="box-sub" fill="#92400e">base64url encoded</text>

  <!-- ~ separator 2 -->
  <text x="414" y="68" font-size="18" fill="#57606a">~</text>

  <!-- Key-Binding JWT (optional) -->
  <rect x="426" y="20" width="200" height="90" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="526" y="44" text-anchor="middle" class="box-title" fill="#5b21b6">Key-Binding JWT</text>
  <text x="526" y="62" text-anchor="middle" class="box-sub" fill="#5b21b6">nonce, aud, iat, sd_hash</text>
  <text x="526" y="78" text-anchor="middle" class="box-sub" fill="#5b21b6">signed by Holder key</text>
  <text x="526" y="94" text-anchor="middle" class="box-sub" fill="#5b21b6">(optional – Part 2 &amp; 3)</text>

  <!-- label: optional -->
  <text x="630" y="68" font-size="11" fill="#57606a" font-style="italic">← optional</text>
</svg>
