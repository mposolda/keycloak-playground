<svg width="100%" viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-navy" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#1e40af"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#1f2328"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .label-title { font-size: 13px; font-weight: 700; }
    .label-sub { font-size: 11px; }
    .step-num { font-size: 11px; font-weight: 700; }
    .step-desc { font-size: 11px; }
  </style>

  <!-- Lifelines (dashed) -->
  <line x1="100" y1="80" x2="100" y2="245" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="380" y1="80" x2="380" y2="245" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="660" y1="80" x2="660" y2="245" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Party Box: Wallet -->
  <rect x="25" y="20" width="150" height="60" rx="6" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="100" y="45" text-anchor="middle" class="label-title" fill="#1e40af">Wallet</text>
  <text x="100" y="64" text-anchor="middle" class="label-sub" fill="#1e40af">no proof key generated</text>

  <!-- Party Box: Issuer -->
  <rect x="305" y="20" width="150" height="60" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="380" y="45" text-anchor="middle" class="label-title" fill="#065f46">Issuer</text>
  <text x="380" y="64" text-anchor="middle" class="label-sub" fill="#065f46">(Keycloak)</text>

  <!-- Party Box: Verifier -->
  <rect x="585" y="20" width="150" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="660" y="45" text-anchor="middle" class="label-title" fill="#92400e">Verifier</text>
  <text x="660" y="64" text-anchor="middle" class="label-sub" fill="#92400e">relying party</text>

  <!-- Message 1: Wallet -> Issuer (Credential Request) -->
  <path d="M 100 110 L 372 110" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arrow-navy)"/>
  <text x="240" y="103" text-anchor="middle" class="step-num" fill="#1e40af">① Credential Request</text>
  <text x="240" y="125" text-anchor="middle" class="step-desc" fill="#57606a">(no proofs field)</text>

  <!-- Message 2: Issuer -> Wallet (Issued SD-JWT VC) -->
  <path d="M 380 155 L 108 155" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="240" y="148" text-anchor="middle" class="step-num" fill="#065f46">② SD-JWT VC</text>
  <text x="240" y="170" text-anchor="middle" class="step-desc" fill="#57606a">(no cnf claim — bearer VC)</text>

  <!-- Message 3: Wallet -> Verifier (Presentation) -->
  <path d="M 100 200 L 652 200" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="380" y="193" text-anchor="middle" class="step-num" fill="#1f2328">③ SD-JWT Presentation</text>
  <text x="380" y="215" text-anchor="middle" class="step-desc" fill="#57606a">(ends with ~, no Key-Binding JWT)</text>

  <!-- Note box under Verifier -->
  <rect x="555" y="228" width="195" height="42" rx="4" fill="#fff1f2" stroke="#ef4444" stroke-width="1"/>
  <text x="652.5" y="244" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">④ Issuer signature verified ✓</text>
  <text x="652.5" y="259" text-anchor="middle" font-size="10.5" fill="#991b1b">No holder binding possible ✗</text>
</svg>
