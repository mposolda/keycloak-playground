<svg width="100%" viewBox="0 0 760 370" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-navy" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#1e40af"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#1f2328"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
    .label-title { font-size: 13px; font-weight: 700; }
    .label-sub { font-size: 11px; }
    .step-num { font-size: 11px; font-weight: 700; }
    .step-desc { font-size: 10px; }
  </style>

  <!-- Lifelines (dashed) -->
  <line x1="75"  y1="80" x2="75"  y2="330" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="260" y1="80" x2="260" y2="330" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="475" y1="80" x2="475" y2="330" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="685" y1="80" x2="685" y2="330" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Party Box: Wallet -->
  <rect x="10" y="20" width="130" height="60" rx="6" fill="#dbeafe" stroke="#3b82d4" stroke-width="1.5"/>
  <text x="75" y="44" text-anchor="middle" class="label-title" fill="#1e40af">Wallet</text>
  <text x="75" y="60" text-anchor="middle" class="label-sub" fill="#1e40af">proof key pair</text>
  <text x="75" y="73" text-anchor="middle" class="label-sub" fill="#1e40af">in secure enclave</text>

  <!-- Party Box: Attester -->
  <rect x="195" y="20" width="130" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="260" y="44" text-anchor="middle" class="label-title" fill="#5b21b6">Attester</text>
  <text x="260" y="60" text-anchor="middle" class="label-sub" fill="#5b21b6">attestation key pair</text>
  <text x="260" y="73" text-anchor="middle" class="label-sub" fill="#5b21b6">trusted by Issuer</text>

  <!-- Party Box: Issuer -->
  <rect x="405" y="20" width="140" height="60" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="475" y="44" text-anchor="middle" class="label-title" fill="#065f46">Issuer (Keycloak)</text>
  <text x="475" y="60" text-anchor="middle" class="label-sub" fill="#065f46">Trusted Key IDP</text>
  <text x="475" y="73" text-anchor="middle" class="label-sub" fill="#065f46">validates attestation</text>

  <!-- Party Box: Verifier -->
  <rect x="620" y="20" width="130" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="685" y="44" text-anchor="middle" class="label-title" fill="#92400e">Verifier</text>
  <text x="685" y="60" text-anchor="middle" class="label-sub" fill="#92400e">verifies issuer sig</text>
  <text x="685" y="73" text-anchor="middle" class="label-sub" fill="#92400e">+ key binding</text>

  <!-- Step 1: Wallet -> Attester (public proof key) -->
  <path d="M 75 108 L 252 108" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="167" y="101" text-anchor="middle" class="step-num" fill="#5b21b6">① Send public proof key</text>

  <!-- Step 2: Attester -> Wallet (key-attestation JWT) -->
  <path d="M 260 144 L 83 144" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="167" y="137" text-anchor="middle" class="step-num" fill="#5b21b6">② Key-attestation JWT</text>
  <text x="167" y="157" text-anchor="middle" class="step-desc" fill="#5b21b6">(wraps proof key, signed by Attester)</text>

  <!-- Step 3: Wallet -> Issuer (Credential Request with attested proof) -->
  <path d="M 75 186 L 467 186" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arrow-navy)"/>
  <text x="270" y="179" text-anchor="middle" class="step-num" fill="#1e40af">③ Credential Request (proofs with attestation)</text>
  <text x="270" y="199" text-anchor="middle" class="step-desc" fill="#57606a">proofs.attestation (or proof JWT + key_attestation header)</text>

  <!-- Step 4: Issuer internal verification -->
  <path d="M 475 210 C 510 210, 510 226, 477 226" fill="none" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <text x="515" y="215" text-anchor="start" class="step-num" fill="#065f46">④ Verify attestation sig</text>
  <text x="515" y="228" text-anchor="start" class="step-desc" fill="#065f46">against Trusted Key IDP</text>

  <!-- Step 5: Issuer -> Wallet (Issued SD-JWT VC) -->
  <path d="M 475 250 L 83 250" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="270" y="244" text-anchor="middle" class="step-num" fill="#065f46">⑤ SD-JWT VC</text>
  <text x="270" y="262" text-anchor="middle" class="step-desc" fill="#57606a">(cnf claim contains proof public key)</text>

  <!-- Step 6: Wallet -> Verifier (Presentation) -->
  <path d="M 75 284 L 677 284" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="380" y="278" text-anchor="middle" class="step-num" fill="#1f2328">⑥ SD-JWT Presentation + Key-Binding JWT</text>
  <text x="380" y="297" text-anchor="middle" class="step-desc" fill="#57606a">&lt;issuer-jwt&gt; ~ &lt;disclosures&gt; ~ &lt;key-binding-jwt&gt;</text>

  <!-- Step 7: Verifier note box -->
  <rect x="560" y="306" width="195" height="48" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="657.5" y="322" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">⑦ Issuer sig ✓  Holder binding ✓</text>
  <text x="657.5" y="337" text-anchor="middle" font-size="9.5" fill="#57606a">(Attestation verified by Issuer at issuance)</text>
</svg>
